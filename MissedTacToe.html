<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missed - Tac - Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Missed - Tac - Toe</h1>
    <p id="rules-text">3 pieces max. 3 in a row wins. Watch out for the fading pieces!</p>

    <div class="controls">
        <div class="control-group">
            <label for="gridSize">Board Size:</label>
            <select id="gridSize">
                <option value="3" selected>3 x 3</option>
                <option value="5">5 x 5</option>
            </select>
        </div>
        <div class="control-group">
            <label for="difficulty">AI Difficulty:</label>
            <select id="difficulty">
                <option value="normal">Normal (Random)</option>
                <option value="expert" selected>Expert (Strategic)</option>
            </select>
        </div>
    </div>

    <div id="status">Your turn (X)</div>

    <div id="board">
    </div>

    <button id="restart">Restart Game</button>

    <script>
        const boardElement = document.getElementById('board');
        const statusText = document.getElementById('status');
        const restartBtn = document.getElementById('restart');
        const difficultySelect = document.getElementById('difficulty');
        const gridSizeSelect = document.getElementById('gridSize');
        const rulesText = document.getElementById('rules-text');
        const rootStyles = document.documentElement.style;

        // Game Configuration Variables
        let size = 3;
        let winReq = 3; 
        let maxPieces = 3;
        let board = [];
        let gameActive = true;
        let queueX = [];
        let queueO = [];
        let winConditions = [];

        // Listeners for settings
        restartBtn.addEventListener('click', initGame);
        difficultySelect.addEventListener('change', initGame);
        gridSizeSelect.addEventListener('change', () => {
            size = parseInt(gridSizeSelect.value);
            // 3x3 needs 3 in a row (3 max). 5x5 needs 4 in a row (4 max).
            if (size === 3) {
                winReq = 3;
                maxPieces = 3;
                rootStyles.setProperty('--cell-size', '100px');
                rootStyles.setProperty('--font-size', '4rem');
                rulesText.innerText = "3 pieces max. 3 in a row wins. Watch out for the fading pieces!";
            } else {
                winReq = 4;
                maxPieces = 4;
                // Scale down visually for larger board
                rootStyles.setProperty('--cell-size', '60px');
                rootStyles.setProperty('--font-size', '2.5rem');
                rulesText.innerText = "5x5 Mode: 4 pieces max. 4 in a row wins. Oldest piece fades away!";
            }
            initGame();
        });

        // Generate dynamic win lines based on board size and win requirement
        function generateWinConditions() {
            let conditions = [];
            // Rows
            for (let r = 0; r < size; r++) {
                for (let c = 0; c <= size - winReq; c++) {
                    let row = [];
                    for (let i = 0; i < winReq; i++) row.push(r * size + c + i);
                    conditions.push(row);
                }
            }
            // Columns
            for (let c = 0; c < size; c++) {
                for (let r = 0; r <= size - winReq; r++) {
                    let col = [];
                    for (let i = 0; i < winReq; i++) col.push((r + i) * size + c);
                    conditions.push(col);
                }
            }
            // Diagonals (Top-Left to Bottom-Right)
            for (let r = 0; r <= size - winReq; r++) {
                for (let c = 0; c <= size - winReq; c++) {
                    let diag = [];
                    for (let i = 0; i < winReq; i++) diag.push((r + i) * size + c + i);
                    conditions.push(diag);
                }
            }
            // Diagonals (Top-Right to Bottom-Left)
            for (let r = 0; r <= size - winReq; r++) {
                for (let c = winReq - 1; c < size; c++) {
                    let diag = [];
                    for (let i = 0; i < winReq; i++) diag.push((r + i) * size + c - i);
                    conditions.push(diag);
                }
            }
            return conditions;
        }

        function initGame() {
            board = Array(size * size).fill('');
            queueX = [];
            queueO = [];
            gameActive = true;
            winConditions = generateWinConditions();

            statusText.innerText = "Your turn (X)";
            statusText.style.color = "var(--text-main)";

            // Build dynamic UI grid
            boardElement.style.gridTemplateColumns = `repeat(${size}, var(--cell-size))`;
            boardElement.innerHTML = '';
            
            for (let i = 0; i < size * size; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.setAttribute('data-index', i);
                cell.addEventListener('click', handleCellClick);
                boardElement.appendChild(cell);
            }
        }

        function handleCellClick(e) {
            const index = parseInt(e.target.getAttribute('data-index'));

            if (board[index] !== '' || !gameActive) return;

            makeMove(index, 'X');
            
            if (gameActive) {
                statusText.innerText = "Computer is thinking...";
                setTimeout(computerTurn, 600); 
            }
        }

        function makeMove(index, player) {
            board[index] = player;
            const currentQueue = player === 'X' ? queueX : queueO;
            
            currentQueue.push(index);

            // Dynamically check against the max piece limit
            if (currentQueue.length > maxPieces) {
                const oldestIndex = currentQueue.shift();
                board[oldestIndex] = ''; 
            }

            updateUI();
            checkWin(player);
        }

        // --- DYNAMIC EXPERT AI LOGIC ---
        function getExpertMove(emptyCells) {
            function simulateMove(index, player, currentBoard, currentQueue) {
                let tempBoard = [...currentBoard];
                let tempQueue = [...currentQueue];
                tempBoard[index] = player;
                tempQueue.push(index);
                if (tempQueue.length > maxPieces) tempBoard[tempQueue.shift()] = '';
                return tempBoard;
            }

            function checkSimWin(tempBoard, player) {
                return winConditions.some(combo => combo.every(idx => tempBoard[idx] === player));
            }

            // 1. Can AI Win immediately?
            for (let i of emptyCells) {
                if (checkSimWin(simulateMove(i, 'O', board, queueO), 'O')) return i;
            }

            // 2. Block player's immediate win
            for (let i of emptyCells) {
                if (checkSimWin(simulateMove(i, 'X', board, queueX), 'X')) return i;
            }

            // 3. Take the center (Dynamic based on board size)
            const centerIndex = Math.floor((size * size) / 2);
            if (emptyCells.includes(centerIndex)) return centerIndex;

            // 4. Take a random corner
            const corners = [0, size - 1, size * (size - 1), size * size - 1];
            const availableCorners = corners.filter(c => emptyCells.includes(c));
            if (availableCorners.length > 0) {
                return availableCorners[Math.floor(Math.random() * availableCorners.length)];
            }

            // 5. Take random edge/open space
            return emptyCells[Math.floor(Math.random() * emptyCells.length)];
        }

        function computerTurn() {
            if (!gameActive) return;

            let emptyCells = [];
            for (let i = 0; i < board.length; i++) {
                if (board[i] === '') emptyCells.push(i);
            }

            if (emptyCells.length === 0) return;

            let bestMove;
            if (difficultySelect.value === 'expert') {
                bestMove = getExpertMove(emptyCells);
            } else {
                bestMove = emptyCells[Math.floor(Math.random() * emptyCells.length)];
            }

            if (bestMove !== undefined) makeMove(bestMove, 'O');
            
            if (gameActive) statusText.innerText = "Your turn (X)";
        }

        function updateUI() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach((cell, i) => {
                cell.innerText = board[i];
                cell.className = 'cell'; 
                if (board[i] === 'X') cell.classList.add('x');
                if (board[i] === 'O') cell.classList.add('o');
            });

            if (queueX.length === maxPieces) cells[queueX[0]].classList.add('fading');
            if (queueO.length === maxPieces) cells[queueO[0]].classList.add('fading');
        }

        function checkWin(player) {
            let roundWon = false;

            for (let i = 0; i < winConditions.length; i++) {
                if (winConditions[i].every(index => board[index] === player)) {
                    roundWon = true;
                    break;
                }
            }

            if (roundWon) {
                statusText.innerText = player === 'X' ? "You Win!" : "Computer Wins!";
                statusText.style.color = player === 'X' ? "var(--x-color)" : "var(--o-color)";
                gameActive = false;
                
                const cells = document.querySelectorAll('.cell');
                cells.forEach(cell => cell.classList.remove('fading'));
            }
        }

        // Initialize the first game on page load
        initGame();
    </script>
</body>
</html>
